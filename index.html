<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DARKC-SINT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>DARKC-SINT</h1>
    <p>CYBERSECURITY DASHBOARD</p>
  </header>

  <main>
    <section class="panel">
      <h2>Générateur de mot de passe</h2>
      <button onclick="generatePassword()">Générer</button>
      <p id="password">Ton mot de passe apparaîtra ici.</p>
    </section>

    <section class="panel">
      <h2>Analyseur de mot de passe</h2>
      <input id="checkPassword" type="password" placeholder="Teste un mot de passe">
      <button onclick="analyzePassword()">Analyser</button>
      <p id="result">En attente...</p>
    </section>

    <section class="panel">
      <h2>Informations navigateur</h2>
      <p id="browser"></p>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    document.getElementById("browser").textContent =
      "Navigateur : " + navigator.userAgent;
  </script>
</body>
</html>
